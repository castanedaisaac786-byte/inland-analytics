name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/ -v

      - name: Part 1 pipeline
        run: python analysis.py

      - name: Part 3 maintenance conversion
        run: cd part3_maintenance_conversion/notebooks && python analysis.py

      - name: Part 4 placement analysis
        run: python part4_placement_analysis.py

      - name: Part 5 campaign experiment
        run: python part5_campaign_experiment.py

      - name: Part 6 attribution
        run: python part6_attribution.py

      - name: Part 7 scale-up pre-registration
        run: python part7_scaleup_test.py

      - name: Section 4 full-spend verification
        run: python verify_section4.py
